syntax = "proto3";

package git_service;

service GitObjectStore {
  rpc ResolveRef(ResolveRefRequest) returns (ResolveRefResponse);
  rpc GetCommit(GetCommitRequest) returns (GetCommitResponse);
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse);
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
}

message ResolveRefRequest {
  string repository_id = 1;
  string repository_name = 2;
  string ref = 3;
}

message ResolveRefResponse {
  string sha = 1;
  string resolved_ref = 2;
}

message GetCommitRequest {
  string repository_id = 1;
  string repository_name = 2;
  string sha = 3;
}

message GetCommitResponse {
  string sha = 1;
  string tree_sha = 2;
  repeated string parent_shas = 3;
  string author = 4;
  string message = 5;
}

message GetTreeRequest {
  string repository_id = 1;
  string repository_name = 2;
  string sha = 3;
}

message TreeEntry {
  string mode = 1;
  string name = 2;
  string sha = 3;
}

message GetTreeResponse {
  string sha = 1;
  repeated TreeEntry entries = 2;
}

message GetBlobRequest {
  string repository_id = 1;
  string repository_name = 2;
  string sha = 3;
}

message GetBlobResponse {
  string sha = 1;
  bytes data = 2;
  int64 size = 3;
}
